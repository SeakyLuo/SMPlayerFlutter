name: smplayer_flutter
description: Cross-platform Simple Melody Player migration workspace.
publish_to: 'none'
version: 3.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: ^17.0.0
  http: ^1.6.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  path: ^1.9.1
  drift: ^2.31.0
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.42
  crypto: ^3.0.7
  uuid: ^4.5.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  audio_service: ^0.18.18
  connectivity_plus: ^7.1.1
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  file_picker: ^11.0.2
  screen_retriever: ^0.2.0
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  url_launcher: ^6.3.2
  fluentui_system_icons: ^1.1.273
  lpinyin: ^2.0.3
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  liquid_glass_widgets: ^0.12.3
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_lints: ^5.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.31.0
  fake_async: ^1.3.2
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/branding/
    - locales/
  fonts:
    - family: FluentSystemIcons
      fonts:
        - asset: packages/fluentui_system_icons/fonts/FluentSystemIcons-Resizable.ttf

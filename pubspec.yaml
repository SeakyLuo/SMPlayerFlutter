name: smplayer_flutter
description: Cross-platform Simple Melody Player migration workspace.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: ^17.0.0
  http: ^1.6.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  path: ^1.9.1
  path_provider: ^2.1.5
  drift: ^2.31.0
  sqlite3_flutter_libs: ^0.5.42
  crypto: ^3.0.7
  uuid: ^4.5.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  just_audio: ^0.10.5
  audio_service: ^0.18.18
  connectivity_plus: ^7.1.1
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  file_picker: ^11.0.2
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  build_runner: ^2.15.0
  drift_dev: ^2.31.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/locales/
